# Vela simulated-system campaign, v3: WFC3/IR F140W at the DESI Strong Lens
# Foundry V observing setup (group decisions of 2026-09-14).
#
# Generator: `vela_simulated` (src/gigalens_research/simtests/experiments/vela_simulated.py,
# generator_version 3). Same pipeline as v2 (lens the PRISTINE Vela source,
# calibrate the source amplitude, reject cut-off arcs, convolve with the
# empirical PSF, add instrument noise); what changed is the instrument:
#
#   camera / filter      WFC3/IR F140W (VELA HLSP has f140w mocks; PHOTFNU -> ZP 26.45)
#   pixel scale          0.065" drizzled (native 0.13"), as in Foundry I / V
#   PSF                  Jay Anderson's STDPSF library, WFC3IR F140W
#   exposure             1197.7 s = 3 x 399.23 s (Foundry I / DESI-238 header), no CR-split
#   noise                white, background_rms 0.0076 cps/px measured on the DESI-238 cutout
#   truth render         supersample 32 (fitter reads inference_supersample 4)
#   cutout               160 x 160 px = 10.4" (2026-09-17; was 120 px)
#   theta_E prior        LogNormal(median 1.5", sigma 0.25)
#   source brightness    VELA's own F140W photometry at z = 1.5 (amplitude 1;
#                        2026-09-17 decision, see `calibration:`). The earlier
#                        Foundry peak-SB / unlensed-magnitude routes are superseded.
#
# No value below is an assumption any more; the remaining open choices are listed
# in docs/logs/vela-simulated-systems.md.

name: vela_f140w_v3
seed: 0
# Relative -> $PSCRATCH/gigalens/simtests_results/vela_f140w_v3 (docs/results-storage.md).
output_dir: simtests_results/vela_f140w_v3

plugins:
  - gigalens_research.simtests.experiments.vela_simulated

dataset:
  generator: vela_simulated

  # ---- Source: which Vela galaxies, at which redshift --------------------
  scale_factor: "a0.400"          # z = 1/a - 1 = 1.5 exactly (HLSP snapshot)
  # Same review list as v2 (12 sources incl. the double-nucleus vela09).
  # vela10 dropped (2026-09-15): a companion cut by the VELA frame edge (7 sigma per
  # image pixel, 2.5% of the flux in the outer 0.15") would enter the cutout truncated.
  # vela07 dropped (2026-09-15, user decision): its far clumps put 5-12% of the flux
  # outside the frame and, with the border rule measured against the real sigma,
  # it only passed the cut-off at a 3-sigma-faint brightness target (lens-only image).
  # Removing it shifts seed_fold_index for the sources after it (user: acceptable).
  vela_ids: ["02", "03", "04", "08", "09", "21", "22", "23", "25", "26"]
  cam: "12"
  filter: "f140w"                 # WFC3/IR; the HLSP tarballs are ~500 MB per sim
  version: "v3"
  n_reps: 1                       # 1 for the review set; raise to 5 for the campaign
  source_variant: IMAGE_PRISTINE  # with dust radiative transfer
  # No crop (2026-09-15, user decision): the source morphology is what these systems
  # test, so it is left as delivered by VELA; the frame edge holds < 1% of the flux
  # for every kept source (docs/logs/vela-simulated-systems.md, "No crop at all?").
  # The 1.5" crop used until then lensed into a visible sub-noise edge (S/N 16 in
  # vela21). Arcs are kept inside the frame by the cut-off redraws alone.
  # No source smoothing (2026-09-17, user decision, reversing the 2-cell Gaussian
  # of the same day). The raw Sunrise maps carry Monte-Carlo sampling noise, but
  # it is confined to faint cells (white, 50-1200% per cell below 1% of the peak;
  # 5-12% at the nuclei), and the nuclear cusps are resolved simulation structure
  # over +-4 cells that a uniform smoothing cut to 30-40% of their peak. The
  # instrument PSF averages the speckle in the data ((0.073")^2 / mu ~ 10 cells^2
  # at mu = 10; raw-vs-smoothed lensed residuals <= 1-2 sigma away from cusps).
  # The evaluation truth for reconstructions is to be defined at the data's
  # source-plane resolution at evaluation time. docs/logs/vela-simulated-systems.md,
  # "Are the nuclear cusps real".
  source_smooth_sigma_pix: null
  source_crop_radius_arcsec: null
  source_recenter: true
  transpose_image: false
  # The per-sim tarballs do not fit in $HOME (40 GiB quota, 99% used): keep the
  # downloads and the extracted sources on scratch.
  datadir: /pscratch/sd/l/linusu/gigalens/vela_downloads
  source_root: /pscratch/sd/l/linusu/gigalens/vela_sources_pristine

  # ---- Image grid ---------------------------------------------------------
  # 160 px (2026-09-17, user decision after the frame-size scan, finding 3): at
  # 120 px the border rule capped theta_E near 1.9" for the extended sources
  # (vela25 lost 81% of its draws), correlating source size with the lens draw.
  # At 160 px with the 2-sigma border below the accepted theta_E is independent
  # of source size (rho +0.03, min acceptance 0.82; frame_size_scan.json).
  # Foundry V uses 64-120 px cutouts; the extra rows are sky.
  num_pix: 160                    # 10.4" at 0.065"/px
  delta_pix: 0.065                # drizzled scale; overrides the mock's 0.06" TPIX
  # Truth render. The VELA pristine sources have 0.0073" pixels: supersample 4
  # (0.016" sub-pixels) under-samples them and left up to 0.74 sigma_bkg of
  # speckle on vela02's arcs, and the lens Sersic cusp moved by 0.5 sigma between
  # sub-grids (experiments/vela_f140w_v3/supersample_check.png, 2026-09-15).
  # 32 (0.002" sub-pixels) is < 0.1 sigma from 16 everywhere; 5-9 s per render.
  supersample: 32
  # What the fitter reads back from meta.json (its own sub-grid, independent of
  # the truth render).
  inference_supersample: 4
  likelihood_precision: float64

  # ---- PSF: STScI empirical WFC3/IR F140W effective PSF (J. Anderson) ------
  psf:
    kind: stdpsf
    era: null                     # the WFC3IR library has one file per filter
    chip_xy: [507, 507]           # detector centre (1014 x 1014); 3x3 grid, nearest used
    size_pix: 33                  # 2.1" box at 0.065"/px (Foundry V: 27-33 px empirical PSFs)
    subsamples: 6
    # Recorded approximation: the ePSF keeps the native 0.13" pixel response
    # (it is not deconvolved before resampling to 0.065"); drizzle (pixfrac)
    # broadening is not modelled. Foundry's own PSF is built from stars in the
    # drizzled mosaic, so both carry a ~native-pixel box.

  # ---- Noise: measured on the DESI-238 F140W cutout (Foundry V) -------------
  # background_rms is the per-pixel background sigma of the real drizzled cutout
  # (data/desi238/cutout238b.npy; photutils.background in
  # experiments/real_systems/desi238/MCLMC_238.ipynb; re-measured 2026-09-15 as
  # 0.0070 clipped), i.e. the number the real-data fits use. exp_time from the
  # header. The noise is added white here; the real cutout's noise is correlated
  # by drizzle (lag-1 autocorrelation 0.60 / 0.52, lag-2 0.10), and the
  # white-noise-equivalent sigma summed over the correlation is ~0.017 cps/px,
  # close to the physical estimate for sky 21.8 mag/arcsec^2 + 3 x 15 e- read
  # noise + dark (0.0196; `kind: instrument`). Modelling the drizzle correlation
  # is a possible later extension.
  noise:
    kind: explicit
    background_rms: 0.0076        # cps per 0.065" px (DESI-238)
    exp_time: 1197.7              # s, DESI-238 header (3 x 399.23 s); Poisson-term gain 1 e-/count

  # ---- Source brightness: the simulation's own photometry -------------------
  # amplitude 1 = the VELA HLSP F140W flux (PHOTFNU-scaled nJy at z = 1.5, distance
  # modulus 45.22 from the header): unlensed 21.2-24.2 AB, M_AB -21 to -24.
  # Decision 2026-09-17 (user), after the Foundry peak-SB anchor (Normal(21.1, 1.0)
  # mag/arcsec^2 over 9 px) returned amplitudes 0.24-1.68 for these lenses: the
  # native brightness already puts the arcs at 20.1-22.1 mag/arcsec^2, inside the
  # Foundry band, so no calibration is applied. The size-brightness correlation
  # (rho(R50, M_AB) = -0.81) is VELA's own size-luminosity relation and is kept
  # on purpose (reviewer finding 3, second mechanism; tabled question 4).
  # `campaign_unlensed_mag.yaml` (the magnification route) is superseded and no
  # longer regenerated.
  calibration:
    source_flux_scale: 1.0

  # ---- Cut-off guarantee ---------------------------------------------------
  cutoff:
    canvas_factor: 2              # measure on a 20.8" canvas
    canvas_supersample: 8         # numerics of the check only (thresholds are 10% / 2 sigma)
    # 10% (2026-09-15): with uncropped sources the light that lands outside the
    # frame is far companions / outer clumps, not the arcs (vela07 has 12% of its
    # flux beyond 3" and cannot pass 1% at any theta_E); the border rule below
    # is what guards against visibly truncated arcs. Losing clumps is accepted.
    max_flux_outside: 0.10
    max_border_sb_sigma: 2.0      # 2 sigma at 160 px (2026-09-17): see num_pix; 1 sigma still selected on theta_E at 160 px (rho -0.32)
    border_width_pix: 3
    max_redraws: 50

  # ---- Lens light: core-Sersic (2026-09-18, user decision, DC-5 option B) --
  # Pure-Sersic cusps are unphysical for n > 4: luminous ellipticals have depleted
  # cores (R_b 20-500 pc ~ 0.5-5% R_e, gamma <~ 0.3; Graham+03, Trujillo+04,
  # Dullo & Graham 2014), and at HST resolution a 2% R_e core changes the central
  # pixel of an n ~ 5 lens by 10 sigma (fit_checks/core_visibility.py). Every lens
  # light is a core-Sersic; the break radius (fraction of R_e) is log-normal (0.3 dex)
  # about a median of 2% for n >= 4.5, falling 0.6 dex per unit n below (1% at n = 4,
  # 0.25% at 3, 0.06% at 2: < 0.06 sigma per pixel, i.e. a pure Sersic to the data's
  # precision, matching the coreless low-n population); gamma ~ U(0, 0.3); alpha = 5.
  # Drawn from an independent random stream: all other truth draws are unchanged
  # from the 2026-09-17 set. Modelled with the same family, R_b free (vela builders,
  # lens_light_profile: core_sersic). docs/logs/vela-f140w-modelling.md, DC-5.
  lens_light_profile: core_sersic

  # ---- Truth prior: overrides on the notebook cell-4 baseline -------------
  truth_prior:
    lens_mass:
      "0":
        theta_E: {dist: LogNormal, median: 1.5, sigma: 0.25}   # group decision
    lens_light:
      "0":
        # Ie is a surface brightness (cps per arcsec^2): the integrated lens flux
        # does not depend on delta_pix (verified: a first v3 run with median 100
        # gave lens light 17.3-17.6 AB, 5x the v2 flux at the same R_e/n prior).
        # Median 20 -> ~19.1 AB in F140W for the baseline R_e / n prior, chosen
        # (2026-09-14) to match the two Foundry V lenses with published I_e
        # (J234 / J246 render to 19.25 / 19.04 AB in the same 120 px cutout);
        # median 30 gave 18.7 AB (0.5 mag brighter than those two).
        Ie: {dist: LogNormal, median: 20.0, sigma: 0.3}

inference:
  builder: epl_shear_sersic_shapelets
  pipeline: map_bootstrap_mclmc
  pipeline_kwargs:
    bootstrap_map_steps: 200
    bootstrap_map_n_samples: 50
    n_chains: 8
    num_burnin_steps: 4000
    num_results: 4000
    desired_energy_variance: 5.0e-4

sweep:
  axis: n_max
  values: [10, 15, 20, 30]

metrics:
  - max_rhat
  - min_ess
  - nan_rate
  - mass_zscores
  - all_zscores
  - wall_time
  - peak_gpu_bytes

execution:
  systems_per_task: 1
