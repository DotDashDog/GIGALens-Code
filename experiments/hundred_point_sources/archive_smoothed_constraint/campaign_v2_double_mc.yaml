# =============================================================================
# hundred_point_sources_v2_double — multiplicity-constraint rerun (P-10)
# =============================================================================
# Rerun of the v2 double arm with the smoothed-image-count multiplicity
# constraint IN the likelihood (docs/logs/point-source-sbc.md P-8/P-9),
# replacing P-7's post-hoc count==2 draw filtering. Same dataset (output_dir
# unchanged — systems are NOT regenerated), same budgets; runs land in
# runs/<sid>/mc1 next to P-7's runs/<sid>/default.
#
# The constraint adds -lam (N_eff - 2)^2 to log_like, with N_eff the
# detectability-weighted smoothed image count (fp32 tiled quadrature,
# window 4*theta_E, step <= eps*sqrt(mu_min)). Pipeline staging (P-9 design):
# bulk MAP and SVI run WITHOUT the term (preconditioner only); a dedicated
# eps-annealed MAP refinement (0.3" -> 0.15" -> 0.1", lam ramped, top-64
# particles) pulls particles out of phantom basins; MCLMC samples the full
# fixed target at eps = 0.1".
#
# Registered predictions (P-9): the 11+1 zero-kept systems recover count-2
# posteriors (frac(N_eff~2) >> 0), gamma SBC ranks uniform WITHOUT post-hoc
# filtering, healthy systems statistically unchanged (term inert in the
# correct basin).

name: hundred_point_sources_v2_double
seed: 3
output_dir: ~/GIGALens-Code/simtests_results/hundred_point_sources_v2_double

plugins:
  - gigalens_research.simtests.experiments.lenstronomy_point_source

# =============================================================================
# DATASET — identical to campaign_v2_double.yaml; the dataset already exists
# at output_dir and is reused verbatim (the generator is not rerun).
# =============================================================================
dataset:
  generator: lenstronomy_point_source
  n_systems: 100
  truth_prior: inference
  source_prior_scale: 0.25
  amp_median: 2.0
  amp_sigma_log: 0.5
  H0_min: 20.0
  H0_max: 100.0
  Om0: 0.3
  z_lens: 0.5
  z_source: 1.5
  multiplicity: double
  max_redraws: 2000
  min_image_sep: 0.05
  sigma_ast: 0.004
  frac_flux: 0.005
  sigma_td: 1.0
  lt_min_distance: 0.01
  lt_search_window: 6.0
  lt_precision_limit: 1.0e-10

# =============================================================================
# INFERENCE — v2 knobs + the multiplicity constraint
# =============================================================================
inference:
  builder: epl_shear_point_source_obs
  pipeline: map_svi_mclmc
  pipeline_kwargs:
    fit_flux: true
    fit_td: true

    newton_steps: 10
    trust_region_frac: 0.4
    src_parameterization: absolute
    priors: from_dataset
    src_anchor_sigma: 0.004

    # --- multiplicity constraint (P-8/P-9; n_obs defaults to n_images = 2) --
    multiplicity_constraint:
      mu_min: 0.1
      eps: 0.1              # final (sampled) kernel width, arcsec
      lam: 10.0
      grid_n: 384           # step = 4*theta_E/384 <= eps*sqrt(mu_min) to theta_E ~ 3"
      n_tiles: 16
      window_scale: 4.0     # window = 4 * theta_E, centered on the EPL
    mc_anneal_eps: [0.3, 0.15]
    mc_anneal_steps: 300
    mc_anneal_particles: 64
    mc_anneal_lr: 1.0e-3

    # --- MAP (term off; anneal phase handles basin selection) ---------------
    map_n_samples: 1000
    map_num_steps: 1500
    map_lr: 3.0e-3
    map_clip_norm: 1.0

    # --- SVI (term off: preconditioner only) --------------------------------
    svi_n_vi: 500
    svi_num_steps: 1500
    svi_lr: 1.0e-4
    svi_init_scale: 1.0e-3

    # --- MCLMC (term ON, fixed eps/lam) — v2 intensive budget ---------------
    n_chains: 8
    num_burnin_steps: 15000
    num_results: 30000
    frac_tune1: 0.2
    frac_tune2: 0.6
    frac_tune3: 0.2
    desired_energy_variance: 5.0e-4

    # --- SBC rank computation + convergence gate ----------------------------
    sbc_rank_draws: 1024
    sbc_rhat_max: 1.05
    sbc_min_ess: 100
    sbc_solver_unconverged_max: 0.05

sweep:
  - {mc: 1}

metrics:
  - max_rhat
  - min_ess
  - nan_rate
  - all_zscores
  - percent_error
  - sbc_ranks
  - loglik_rank
  - ps_solver_health
  - wall_time
  - peak_gpu_bytes

execution:
  systems_per_task: 1
